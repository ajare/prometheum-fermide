version: 3
name: Shuttle Test 2
cellsWide: 40
decksHigh: 3
construction:
  - type: corridor
    y: 1
    x: 0
    cellsWide: 10
    decksHigh: 1
  - type: corridor
    y: 1
    x: 30
    cellsWide: 10
    decksHigh: 1

  # One three-cell carriage. doorMask 2 selects only its middle cell.
  # Shuttle construction creates the matching one-cell landing Door in each Corridor.
  - type: shuttle
    y: 1
    x: 7
    cellsWide: 26
    numCars: 1
    carWidth: 3
    stopOffsets: [0, 23]
    initialStop: 0
    capacityPerCarriage: 5
    doorMask: 2
    minimumDwellSeconds: 0.75
    maximumBoardingSeconds: 5
    allowPartialLandings: false

  - type: marker
    sectorIndex: 0
    deckIndex: 0
    xOffset: 0.5
  - type: marker
    sectorIndex: 1
    deckIndex: 0
    xOffset: 9.5

