version: 3
name: Shuttle Test 3
cellsWide: 70
decksHigh: 3
construction:
  # Four separated platforms connected by one Shuttle.
  - type: corridor
    y: 1
    x: 0
    cellsWide: 12
    decksHigh: 1
  - type: corridor
    y: 1
    x: 19
    cellsWide: 12
    decksHigh: 1
  - type: corridor
    y: 1
    x: 38
    cellsWide: 12
    decksHigh: 1
  - type: corridor
    y: 1
    x: 57
    cellsWide: 12
    decksHigh: 1

  # One five-cell carriage. doorMask 10 selects cells at offsets 1 and 3.
  # Shuttle construction creates the two matching landing Doors at every stop.
  - type: shuttle
    y: 1
    x: 7
    cellsWide: 62
    numCars: 1
    carWidth: 5
    stopOffsets: [0, 19, 38, 57]
    initialStop: 0
    capacityPerCarriage: 5
    doorMask: 10
    minimumDwellSeconds: 3
    maximumBoardingSeconds: 5
    allowPartialLandings: false

  # One destination marker on each platform.
  - type: marker
    sectorIndex: 0
    deckIndex: 0
    xOffset: 1.5
  - type: marker
    sectorIndex: 1
    deckIndex: 0
    xOffset: 1.5
  - type: marker
    sectorIndex: 2
    deckIndex: 0
    xOffset: 1.5
  - type: marker
    sectorIndex: 3
    deckIndex: 0
    xOffset: 1.5

agents:
  # Destination markers were selected randomly from the other three stops.
  - id: 1
    agent: { name: Stop 1 Agent 1, flags: 0 }
    sector: 0
    localX: 3.5
    localY: 0
    path: { destinationSector: 1, destinationLocalX: 1.5, destinationLocalY: 0, active: true }
  - id: 2
    agent: { name: Stop 1 Agent 2, flags: 0 }
    sector: 0
    localX: 4.5
    localY: 0
    path: { destinationSector: 2, destinationLocalX: 1.5, destinationLocalY: 0, active: true }
