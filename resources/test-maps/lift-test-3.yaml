  - type: walkway
    sectorIndex: 0
    deckIndex: 2
    xOffset: 14
  - type: walkway
    sectorIndex: 0
    deckIndex: 2
    xOffset: 15

  # The enclosed Lift occupies the Back layer and opens onto all three floors.
  - type: lift
    y: 0
    x: 8
    cellsWide: 1
    decksHigh: 3
    stopOffsets: [0, 1, 2]
    capacity: 2
    minimumDwellSeconds: 0.75
    maximumBoardingSeconds: 5
    initialStop: 0

  # A marker at each end of the ground floor and both Walkways.
  - type: marker
    sectorIndex: 0
    deckIndex: 0
    xOffset: 0.5
  - type: marker
    sectorIndex: 0
    deckIndex: 0
    xOffset: 15.5
  - type: marker
    sectorIndex: 0
    deckIndex: 1
    xOffset: 0.5
  - type: marker
    sectorIndex: 0
    deckIndex: 1
    xOffset: 15.5
  - type: marker
    sectorIndex: 0
    deckIndex: 2
    xOffset: 0.5
  - type: marker
    sectorIndex: 0
    deckIndex: 2
    xOffset: 15.5

agents:
  # Ground-left group -> top-right marker.
  - id: 1
    agent: { name: Ground Left 1, flags: 0 }
    sector: 0
    localX: 1.25
    localY: 0
    path: { destinationSector: 0, destinationLocalX: 15.5, destinationLocalY: 2, active: true }
